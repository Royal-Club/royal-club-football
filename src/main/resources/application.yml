spring:
  application:
    name: royal-club-football

  main:
    allow-circular-references: true

  datasource:
    url: jdbc:mysql://localhost:3306/royal_club_football?useSSL=false&serverTimezone=UTC
    username: root
    password: brFc129
    driver-class-name: com.mysql.cj.jdbc.Driver

    # Sized against what MySQL on this host can comfortably serve, not against the request threads.
    # A bigger pool does not mean more throughput: past the point the database can keep up it just
    # moves the queue from Tomcat into MySQL, where it is harder to see.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # Fail a connection-starved request in 10s with a clear error rather than hanging on it.
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Logs a stack trace when a connection is held longer than this. This is what catches the
      # "slow network call inside a transaction" mistake before it exhausts the pool in production.
      leak-detection-threshold: 60000

  jackson:
    time-zone: UTC  # Ensure Jackson operates with UTC for date serialization

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate  # Validate schema without altering it
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc.time_zone: UTC  # Ensures Hibernate operates in UTC

  flyway:
    baseline-on-migrate: true  # Ensure Flyway migrates from a clean baseline

  # Resend SMTP. Username is the literal "resend"; the password is the API key (never commit it).
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${RESEND_API_KEY:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  servlet:
    multipart:
      # Resource-library uploads (formation diagrams, PDFs) are larger than avatars.
      max-file-size: 25MB
      max-request-size: 25MB

  # Every @Scheduled method shares this pool, and Spring's default size is 1 - so a reminder run
  # working through 30 sequential SMTP sends (with retries) would block the auction timer, which
  # fires every second, and the SSE heartbeat that prunes dead match connections. A frozen auction
  # countdown is the visible symptom; connections leaking until the heartbeat resumes is the quiet one.
  #
  # Four threads keeps the two long mail jobs off the two latency-sensitive ones. Raising this is
  # preferable to making the mail jobs @Async: overlapping runs are only safe because of their
  # log-based de-duplication, and that is a subtle property to start depending on.
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:4}



server:
  port: 9191
  # Deliberately far below the old 200 default: 200 threads contending for 20 connections turns a
  # clean rejection into a slow collapse, where every request waits and none finish quickly.
  # Keeping threads near what the pool can serve makes overload behave predictably.
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:50}
      min-spare: 10
    accept-count: 100

jwt:
  # Overridable so production can stop signing logins with this committed default.
  # Changing it invalidates every issued token, so everyone is logged out once on the deploy that sets it.
  secret: ${JWT_SECRET:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3ODkwYWJjZGVmZ2hpamts}
  expiration: 604800000  # Token expiration in milliseconds (7 days)

player:
  default-password: JaniNa@123 # Configurable default password assigned at registration
  superadmin-email: rakibccj@gmail.com # Email of the player to assign SUPERADMIN role on application startup. Service will automatically assign this role when app starts. Leave empty to skip.

# Firebase Cloud Messaging (push notifications). Defaults to the git-ignored service-account JSON in ./secret.
# Set both blank (or point elsewhere via the env vars) to disable/relocate; app still boots if the file is missing.
firebase:
  # Path is relative to the working directory (repo root). The env var overrides it for other environments.
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:./secret/royalclub-1ff75-firebase-adminsdk-fbsvc-7711cd6aa8.json}
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:} # Alternatively, the raw service-account JSON (handy for env-var based deploys).

# Tournament RSVP reminder settings.
reminders:
  # Reminders go out on calendar-day offsets: D-2, D-1 and match day (kickoff must still be ahead).
  lead-days: ${REMINDERS_LEAD_DAYS:2}           # Start reminding this many calendar days before the tournament.
  max-per-player: ${REMINDERS_MAX_PER_PLAYER:3} # Safety net; the D-2/D-1/D-0 schedule already caps at 3.
  cron: ${REMINDERS_CRON:0 0 9 * * ?}           # When the reminder job runs (Asia/Dhaka).
  zone: ${REMINDERS_ZONE:Asia/Dhaka}            # Day boundaries are resolved in this zone, not the server's.

# Monthly club dues reminders. Current month only - an unpaid month is never chased again
# once the next month begins.
dues-reminders:
  email-enabled: ${DUES_REMINDERS_EMAIL_ENABLED:true} # Applies club-wide; there is no per-member opt-out.
  max-per-month: ${DUES_REMINDERS_MAX_PER_MONTH:3}    # Safety net; the 5th/10th/15th schedule already caps at 3.
  cron: ${DUES_REMINDERS_CRON:0 0 10 5,10,15 * ?}     # 10:00 AM on the 5th, 10th and 15th.
  zone: ${DUES_REMINDERS_ZONE:Asia/Dhaka}             # Month and day boundaries resolve in club time.

# Invitation / reminder email delivery.
mail:
  enabled: ${MAIL_ENABLED:true}                 # Global kill switch; the per-tournament toggle is separate.
  from-address: ${MAIL_FROM_ADDRESS:noreply@royalfootball.club}
  from-name: ${MAIL_FROM_NAME:Royal Football Club}
  # Most SMTP failures are transient. Without a retry the member waits for the next scheduled run -
  # a day for RSVP, five days for dues. Authentication failures are never retried.
  max-attempts: ${MAIL_MAX_ATTEMPTS:3}
  retry-backoff-ms: ${MAIL_RETRY_BACKOFF_MS:1000}   # Multiplied by the attempt number.

# One-click RSVP links embedded in emails.
rsvp:
  token:
    # MUST differ from jwt.secret so an RSVP link can never be replayed as a login token.
    secret: ${RSVP_TOKEN_SECRET:cnN2cC10b2tlbi1zZWNyZXQtY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tMDEyMzQ1}
  landing-url: ${RSVP_LANDING_URL:${app.frontend.base-url}/rsvp}

# Emailed password recovery for members who cannot sign in.
password-reset:
  max-per-window: ${PASSWORD_RESET_MAX_PER_WINDOW:3}   # Links per member per window, counted on delivery.
  window-days: ${PASSWORD_RESET_WINDOW_DAYS:30}        # Rolling, not calendar: no free refill on the 1st.
  link-ttl-minutes: ${PASSWORD_RESET_LINK_TTL_MINUTES:60} # A link is a standing takeover of an account; keep it short.
  token:
    # MUST differ from jwt.secret so a reset link can never be replayed as a login token.
    secret: ${PASSWORD_RESET_TOKEN_SECRET:cGFzc3dvcmQtcmVzZXQtc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTAx}
  landing-url: ${PASSWORD_RESET_LANDING_URL:${app.frontend.base-url}/password-reset}
  # A row left PENDING this long was abandoned by a process that died mid-send. Well clear of the
  # 10s mail timeout, so a send still in flight is never reaped from under it.
  stale-pending-minutes: ${PASSWORD_RESET_STALE_PENDING_MINUTES:15}
  reaper-interval-ms: ${PASSWORD_RESET_REAPER_INTERVAL_MS:600000}
  reaper-initial-delay-ms: ${PASSWORD_RESET_REAPER_INITIAL_DELAY_MS:60000}

app:
  # Public site the RSVP links point at.
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  storage:
    player:
      provider: ${RC_PLAYER_STORAGE_PROVIDER:local}
      upload-dir: ${RC_PLAYER_UPLOAD_DIR:./uploads/player-profiles}
      base-url: ${RC_PLAYER_STORAGE_BASE_URL:http://localhost:${server.port}}
      r2:
        endpoint: ${RC_PLAYER_R2_ENDPOINT:}
        bucket: ${RC_PLAYER_R2_BUCKET:}
        access-key: ${RC_PLAYER_R2_ACCESS_KEY_ID:}
        secret-key: ${RC_PLAYER_R2_SECRET_ACCESS_KEY:}
        presign-duration-minutes: ${RC_PLAYER_R2_PRESIGN_MINUTES:60}
  team-logo:
    storage-provider: ${TEAM_LOGO_STORAGE_PROVIDER:local}
    upload-dir: ${TEAM_LOGO_UPLOAD_DIR:uploads/team-logos}
    base-url: ${TEAM_LOGO_BASE_URL:http://localhost:9191}
    r2:
      endpoint: ${TEAM_LOGO_R2_ENDPOINT:}
      bucket: ${TEAM_LOGO_R2_BUCKET:}
      access-key: ${TEAM_LOGO_R2_ACCESS_KEY:}
      secret-key: ${TEAM_LOGO_R2_SECRET_KEY:}
      presign-duration-minutes: ${TEAM_LOGO_R2_PRESIGN_MINUTES:60}
  resource-file:
    storage-provider: ${RESOURCE_FILE_STORAGE_PROVIDER:${TEAM_LOGO_STORAGE_PROVIDER:local}}
    upload-dir: ${RESOURCE_FILE_UPLOAD_DIR:uploads/resources}
    base-url: ${RESOURCE_FILE_BASE_URL:${TEAM_LOGO_BASE_URL:http://localhost:9191}}
    r2:
      endpoint: ${RESOURCE_FILE_R2_ENDPOINT:${TEAM_LOGO_R2_ENDPOINT:}}
      bucket: ${RESOURCE_FILE_R2_BUCKET:${TEAM_LOGO_R2_BUCKET:}}
      access-key: ${RESOURCE_FILE_R2_ACCESS_KEY:${TEAM_LOGO_R2_ACCESS_KEY:}}
      secret-key: ${RESOURCE_FILE_R2_SECRET_KEY:${TEAM_LOGO_R2_SECRET_KEY:}}
      presign-duration-minutes: ${RESOURCE_FILE_R2_PRESIGN_MINUTES:${TEAM_LOGO_R2_PRESIGN_MINUTES:60}}
  player-photo:
    storage-provider: ${PLAYER_PHOTO_STORAGE_PROVIDER:${TEAM_LOGO_STORAGE_PROVIDER:local}}
    upload-dir: ${PLAYER_PHOTO_UPLOAD_DIR:uploads/player-photos}
    base-url: ${PLAYER_PHOTO_BASE_URL:${TEAM_LOGO_BASE_URL:http://localhost:9191}}
    r2:
      endpoint: ${PLAYER_PHOTO_R2_ENDPOINT:${TEAM_LOGO_R2_ENDPOINT:}}
      bucket: ${PLAYER_PHOTO_R2_BUCKET:${TEAM_LOGO_R2_BUCKET:}}
      access-key: ${PLAYER_PHOTO_R2_ACCESS_KEY:${TEAM_LOGO_R2_ACCESS_KEY:}}
      secret-key: ${PLAYER_PHOTO_R2_SECRET_KEY:${TEAM_LOGO_R2_SECRET_KEY:}}
      presign-duration-minutes: ${PLAYER_PHOTO_R2_PRESIGN_MINUTES:${TEAM_LOGO_R2_PRESIGN_MINUTES:60}}

# Health and metrics — including mail delivery (club.mail.messages) and Hikari pool usage.
#
# Deliberately on its own port bound to loopback: the security chain ends in .anyRequest().permitAll(),
# so anything on 9191 is reachable from the internet, and metrics should not be. Reach it from the
# server itself, e.g. curl localhost:9192/actuator/metrics/club.mail.messages
management:
  server:
    port: ${MANAGEMENT_PORT:9192}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO  # Default log level for the entire application
    com.bjit.royalclub.royalclubfootball: INFO  # Specific log level for your application package
  file:
    name: logs/royal_club_football.log  # Log file name and location
  logback:
    rollingpolicy:
      file-name-pattern: logs/royal_club_football.%d{yyyy-MM-dd}.%i.gz.log  # Rolling file configuration
      max-file-size: 10MB
      total-size-cap: 1GB
      max-history: 7
      clean-history-on-start: true
